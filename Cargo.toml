[package]
# Ported from: Silent Gear 4.2.1.1 (SilentChaos512/Silent-Gear, MIT),
# Minecraft Java 1.21.1 NeoForge. Local-only until the maintainer approves
# publishing (ARCHITECTURE.md §8).
name = "horizon-silentgear"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Silent Gear for Horizon: assemble a pickaxe from parts with material stats"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
